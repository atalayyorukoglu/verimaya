name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verimaya
          POSTGRES_PASSWORD: verimaya
          POSTGRES_DB: verimaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verimaya -d verimaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://verimaya:verimaya@localhost:5432/verimaya
      DATABASE_URL_APP: postgresql://verimaya_app:verimaya@localhost:5432/verimaya
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:5173
      CREDENTIALS_ENCRYPTION_KEY: '0909090909090909090909090909090909090909090909090909090909090909'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Shared typecheck
        run: pnpm --filter @verimaya/shared check

      - name: Shared tests
        run: pnpm --filter @verimaya/shared test

      # F-09 (Faz 7): @verimaya/shared'ın package.json exports'u production koşulunda
      # ./dist/index.js'e çözülüyor ve dist/ gitignore'da — temiz bir CI checkout'unda
      # "Web production build" adımı bu olmadan "failed to resolve @verimaya/shared"
      # ile kırılır. Yerelde geçmesinin sebebi eski bir dist klasörünün duruyor olması.
      - name: Shared build
        run: pnpm --filter @verimaya/shared build

      - name: Lint and format (web)
        run: pnpm --filter @verimaya/web lint

      - name: API migrate
        run: pnpm --filter @verimaya/api db:migrate

      - name: API typecheck + build
        run: pnpm --filter @verimaya/api check && pnpm --filter @verimaya/api build

      - name: API tests (RLS isolation + queue smoke)
        run: pnpm --filter @verimaya/api test

      - name: Web check
        run: pnpm --filter @verimaya/web check

      - name: Web tests
        run: pnpm --filter @verimaya/web test

      - name: Web production build
        run: pnpm --filter @verimaya/web build

  # Advisory only: must not flip workflow conclusion (OPS-03 deploy-web.yml
  # gates on workflows: [CI] + conclusion == success). continue-on-error keeps
  # red audit from blocking unrelated PRs / main auto-deploy.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (report-only; non-blocking)
        run: pnpm audit
