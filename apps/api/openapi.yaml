openapi: 3.1.0
info:
  title: Verimaya API
  version: 0.1.0
  description: |
    Multi-tenant B2B SaaS API for health tourism operations (Verimaya).

    **Base URL:** `/v1` (e.g. `http://localhost:3000/v1`)

    **Authentication:**
    - Browser/session routes use better-auth cookies (`SessionGuard` + active organization).
    - Auth endpoints live under `/v1/auth/*` (not repeated here in full).
    - Machine/API access via `Authorization: Bearer vk_...` is planned (`ApiKeyGuard` exists but is not global yet).

    **Errors:** All HTTP errors return `{ error: { code, message }, request_id }`.

    **Pagination:** Cursor-based list endpoints accept `?cursor=` and `?limit=` (1–100, default 25).
    Response includes `next_cursor` (nullable) or `items` + `next_cursor` depending on resource.

    **Idempotency:** Mutating domain endpoints accept optional `Idempotency-Key` header.

    This spec is maintained manually (NestJS + Fastify; no runtime Swagger UI yet).

servers:
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Auth
    description: Session and organization (better-auth)
  - name: Patients
  - name: Contacts
  - name: Webhooks
  - name: WhatsApp
  - name: Reports
  - name: API Keys
  - name: Health

components:
  schemas:
    ApiError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }

    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        display_name: { type: string }
        contact_type_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    InboundMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        chat_name: { type: string, nullable: true }
        sender: { type: string, nullable: true }
        body: { type: string, nullable: true }
        has_media: { type: boolean }
        media_path: { type: string, nullable: true }
        status:
          type: string
          enum: [new, parsed, approved, ignored]
        parsed_records: { type: array, items: { type: object }, nullable: true }
        parse_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    CursorPagePatients:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Patient' } }
        next_cursor: { type: string, nullable: true }

    CursorPageContacts:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        next_cursor: { type: string, nullable: true }

    InboxList:
      type: object
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/InboundMessage' } }
        next_cursor: { type: string, nullable: true }

    WebhookAccepted:
      type: object
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        integration_event_id: { type: string, format: uuid }
        inbound_message_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }

    ReportSummary:
      type: object
      description: Period aggregate (income, expense, net — minor units)
      additionalProperties: true

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    SearchQ:
      name: q
      in: query
      schema: { type: string }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: better-auth session cookie (browser clients)
    bearerApiKey:
      type: http
      scheme: bearer
      description: API key `vk_...` (route-level guard; not all endpoints)

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        '200':
          description: OK

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness (Postgres + Redis)
      responses:
        '200':
          description: Ready
        '503':
          description: Dependency unavailable

  /me:
    get:
      tags: [Auth]
      summary: Current session user and active organization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session payload
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /patients:
    get:
      tags: [Patients]
      summary: List patients (cursor + search)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Patient page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPagePatients' }
    post:
      tags: [Patients]
      summary: Create patient
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string }
      responses:
        '201':
          description: Created patient

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient by id
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Patient
        '404':
          description: Not found

  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts (cursor + search)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Contact page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageContacts' }

  /contacts/{id}:
    get:
      tags: [Contacts]
      summary: Get contact by id
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contact
        '404':
          description: Not found

  /webhooks/{provider}:
    post:
      tags: [Webhooks]
      summary: Generic queue-first webhook ingest (GHL, Meta, Google, …)
      description: |
        Validates stub signature, writes `integration_events`, enqueues BullMQ job. Returns **202 Accepted**.
        Idempotent on `(provider, external_event_id)`.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          example: ghl
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
          description: Must match `WEBHOOK_STUB_SECRET` (dev default `dev-webhook-secret`)
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-External-Event-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted for async processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAccepted' }
        '401':
          description: Invalid or missing signature

  /webhooks/waha:
    post:
      tags: [Webhooks]
      summary: WAHA WhatsApp webhook ingest
      description: |
        Queue-first ingest for WAHA message events. Writes `inbound_messages`
        (unique on tenant + provider + external_id) and enqueues `inbound_message.process`.
        Returns **202 Accepted**.
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-External-Event-Id
          in: header
          required: false
          schema: { type: string }
          description: WAHA message id override; otherwise extracted from payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: WAHA webhook body (event + payload)
              additionalProperties: true
            example:
              event: message
              session: default
              payload:
                id: true_120363143271144447@g.us_3EB0ABCDEF
                from: 120363143271144447@g.us
                chatName: Fixrav Finans
                body: Sandra 2900 GBP ödeme alındı
                hasMedia: false
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAccepted' }

  /whatsapp/inbox:
    get:
      tags: [WhatsApp]
      summary: List inbound WhatsApp messages (cursor)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inbox page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxList' }

  /whatsapp/inbox/{id}:
    get:
      tags: [WhatsApp]
      summary: Get single inbound message
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Inbound message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundMessage' }
        '404':
          description: Not found (or other tenant)

  /whatsapp/parse:
    post:
      tags: [WhatsApp]
      summary: Heuristic parse stub (no LLM yet)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Parsed transaction drafts

  /reports/summary:
    get:
      tags: [Reports]
      summary: Period income/expense/net summary
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Summary aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }

  /reports/by-category:
    get:
      tags: [Reports]
      summary: Expense/income breakdown by category
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Category breakdown

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys (no hash)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [API Keys]
      summary: Create API key (plaintext returned once)
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created (includes `key` field once)

  /api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke API key
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Revoked
