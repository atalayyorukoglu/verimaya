server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Apex / www: hub at `/` (URL stays /). App host: SPA panel shell.
	set $marketing 0;
	if ($host = verimaya.com) { set $marketing 1; }
	if ($host = www.verimaya.com) { set $marketing 1; }

	# Legacy /vitrin → hub root
	location = /vitrin {
		return 301 /;
	}
	location = /vitrin/ {
		return 301 /;
	}

	# Static marketing snapshot. Block module imports so leftover SvelteKit
	# kit.start (wrong /vitrin hydrate at /) cannot tear down prerendered DOM.
	# Inline theme FOUC script still runs ('unsafe-inline').
	location = /hub.html {
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; worker-src 'none';" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files /hub.html =404;
	}

	location = / {
		if ($marketing = 1) {
			rewrite ^ /hub.html last;
		}
		try_files /index.html =404;
	}

	# Prerendered pages before SPA fallback.
	location / {
		try_files $uri $uri/index.html $uri/ /index.html;
	}

	location = /robots.txt {
		try_files $uri =404;
	}

	location = /sitemap.xml {
		try_files $uri =404;
	}
}
