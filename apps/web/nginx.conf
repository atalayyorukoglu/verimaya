server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Apex / www: hub at `/` (URL stays /). App host: SPA panel shell.
	set $marketing 0;
	if ($host = verimaya.com) { set $marketing 1; }
	if ($host = www.verimaya.com) { set $marketing 1; }

	# Legacy /vitrin → hub root
	location = /vitrin {
		return 301 /;
	}
	location = /vitrin/ {
		return 301 /;
	}

	location = / {
		if ($marketing = 1) {
			rewrite ^ /hub.html last;
		}
		try_files /index.html =404;
	}

	# Prerendered pages before SPA fallback.
	location / {
		try_files $uri $uri/index.html $uri/ /index.html;
	}

	location = /robots.txt {
		try_files $uri =404;
	}

	location = /sitemap.xml {
		try_files $uri =404;
	}
}
