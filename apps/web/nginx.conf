server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Prerendered pages (e.g. /vitrin/index.html) before SPA fallback.
	location / {
		try_files $uri $uri/index.html $uri/ /index.html;
	}

	location = /robots.txt {
		try_files $uri =404;
	}

	location = /sitemap.xml {
		try_files $uri =404;
	}
}
