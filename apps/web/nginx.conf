server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Apex / www: hub at `/` (URL stays /). App host: SPA panel shell.
	set $marketing 0;
	if ($host = verimaya.com) { set $marketing 1; }
	if ($host = www.verimaya.com) { set $marketing 1; }

	# Legacy /vitrin → hub root
	location = /vitrin {
		return 301 /;
	}
	location = /vitrin/ {
		return 301 /;
	}

	# Static marketing snapshot. Block module imports so leftover SvelteKit
	# kit.start (wrong /vitrin hydrate at /) cannot tear down prerendered DOM.
	#
	# script-src: 'self' allows only /hub-interact.js (progressive enhancement for
	# theme/menu/login — kit client is still stripped from hub.html so no blank-page
	# remount). The two sha256 hashes pin the known inline scripts: app.html theme
	# FOUC + HubHome JSON-LD. Any other/injected inline script is blocked.
	# Hashes are content hashes (sha256 of the exact script text) — if either
	# script's content changes, its hash MUST be recomputed here or the page
	# breaks (theme flashes / JSON-LD silently dropped), which is the point:
	# fail loud, don't silently fall back to allowing arbitrary inline JS.
	# Recompute with: python3 -c "import re,hashlib,base64;h=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',open('build/hub.html').read(),re.S);[print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode()) for s in h if s.strip()]"
	location = /hub.html {
		# Deploy edilen prerender HTML her kullanımda origin ile doğrulansın.
		add_header Cache-Control "no-cache, must-revalidate" always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'sha256-luS60P/ivFWsURnPfGwYNhudm4Ahnma9HDV0FsU1qrA=' 'sha256-sL9/mvhqYuzaLbxlAxwEutW/9Pwh+vq+9lLjxGQq6jY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; worker-src 'none';" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files /hub.html =404;
	}

	location = / {
		# SPA kabuğu cache'lenebilir ama bayat hash'leri tutmaması için her kullanımda doğrulanır.
		add_header Cache-Control "no-cache, must-revalidate" always;
		if ($marketing = 1) {
			rewrite ^ /hub.html last;
		}
		try_files /index.html =404;
	}

	# Prerendered pages before SPA fallback.
	location / {
		# SPA fallback ile dönen index.html her kullanımda doğrulanarak yeni deploy'u görür.
		add_header Cache-Control "no-cache, must-revalidate" always;
		try_files $uri $uri/index.html $uri/ /index.html;
	}

	# Service worker script'i deploy sonrası beklemeden yeniden doğrulansın.
	location = /sw.js {
		add_header Cache-Control "no-cache" always;
		try_files /sw.js =404;
	}

	# İçerik hash'li SvelteKit asset'leri değişmez; bir yıl güvenle cache'lenebilir.
	location ^~ /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# Hub progressive-enhancement script — short edge cache; HTML pins ?h= content hash.
	location = /hub-interact.js {
		add_header Cache-Control "public, max-age=60, must-revalidate" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files /hub-interact.js =404;
	}

	location = /robots.txt {
		try_files $uri =404;
	}

	location = /sitemap.xml {
		try_files $uri =404;
	}

	# Chrome ignores PWA icons when webmanifest is served as octet-stream
	# (default nginx → orange monogram "V" from theme_color).
	location = /manifest.webmanifest {
		types { }
		default_type application/manifest+json;
		add_header Cache-Control "public, max-age=300, must-revalidate" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files /manifest.webmanifest =404;
	}

	location ~* ^/(favicon\.ico|favicon-16\.png|favicon-32\.png|icon-192\.png|icon-512\.png|apple-touch-icon\.png|icon\.svg)$ {
		add_header Cache-Control "public, max-age=300, must-revalidate" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
}
