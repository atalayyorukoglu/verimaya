# Verimaya iOS.
# Web paneli kaynak: apps/web/src/lib/components/AppShell.svelte + routes/*
name: Verimaya
options:
  bundleIdPrefix: com.verimaya
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Verimaya:
    type: application
    platform: iOS
    sources:
      - path: Verimaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verimaya.app
        INFOPLIST_FILE: Verimaya/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_TESTABILITY: YES
        # Sunucu adresi Info.plist'e GÖMÜLÜR (`VerimayaAPIURL`). Ana ekrandan
        # açılan uygulamada ortam değişkeni yoktur; yalnız ona bakan bir sürüm
        # cihazda localhost'a bağlanmaya çalışır (arşiv, "Ortam notları").
        VERIMAYA_API_URL_DEFAULT: https://api.verimaya.com
    scheme:
      testTargets:
        - VerimayaTests
        - VerimayaUITests

  VerimayaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VerimayaTests
    dependencies:
      - target: Verimaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verimaya.app.tests
        GENERATE_INFOPLIST_FILE: true

  # UI testleri CANLI API ister. Değişkenler `TEST_RUNNER_` önekiyle geçirilir:
  # XCUITest koşucusu ayrı bir süreçtir, öneksiz değişken ona ulaşmaz.
  #   TEST_RUNNER_VERIMAYA_API_URL
  #   TEST_RUNNER_VERIMAYA_UITEST_EMAIL
  #   TEST_RUNNER_VERIMAYA_UITEST_PASSWORD
  # Değişken yoksa testler ATLANIR (CI Node tarafında koşuyor, bunları görmez).
  VerimayaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerimayaUITests
    dependencies:
      - target: Verimaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verimaya.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Verimaya
