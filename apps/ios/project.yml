name: Verimaya
options:
  bundleIdPrefix: com.verimaya
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Verimaya:
    type: application
    platform: iOS
    sources:
      - path: Verimaya
      - path: Verimaya/Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verimaya.app
        INFOPLIST_FILE: Verimaya/Info.plist
        CODE_SIGN_ENTITLEMENTS: Verimaya/Verimaya.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - VerimayaTests

  VerimayaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VerimayaTests
    dependencies:
      - target: Verimaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verimaya.app.tests
        GENERATE_INFOPLIST_FILE: true
